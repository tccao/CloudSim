[project]
name = "cloudsim-backend"
version = "0.1.0"
description = "CloudSim FastAPI backend — auth, RBAC, and EC2-style instance lifecycle over a mock or live AWS facade."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.4.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
]

# Test-only dependencies. Installed by `uv sync` (the dev group is included by
# default) and excluded from production images via `uv sync --no-dev`.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",   # without this, async def tests silently pass without running
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",            # TestClient dependency for newer FastAPI/Starlette
    "moto[ec2,cloudwatch,ce]>=5.0.0",  # intercept boto3 calls at the botocore transport layer
]

# This is an application, not a distributable package: uv manages the
# environment and dependencies without building/installing the project itself.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "9.0"
asyncio_mode = "auto"
markers = [
    "unit: Pure functions, no IO",
    "integration: DB involved, no HTTP",
    "api: Full HTTP through TestClient",
    "aws: Requires moto",
]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "WARNING"
