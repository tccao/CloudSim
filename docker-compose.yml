services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cloudsim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
    ports:
      - "5432:5432"
    volumes:
      - cloudsim_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudsim"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      CLOUDSIM_ENVIRONMENT: development
      CLOUDSIM_DEBUG: "true"
      DATABASE_URL: postgresql://postgres:1@db:5432/cloudsim
      SECRET_KEY: ${SECRET_KEY:-cloudsim-local-dev-secret-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-096615316348}
      ENABLE_COST_EXPLORER: ${ENABLE_COST_EXPLORER:-false}
      ENABLE_ROLE_BASED_ACCESS: ${ENABLE_ROLE_BASED_ACCESS:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cloudsim_postgres_data:
