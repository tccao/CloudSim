name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDSIM_ENVIRONMENT: test
      CLOUDSIM_DEBUG: "true"
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      ENABLE_COST_EXPLORER: "false"
      ENABLE_ROLE_BASED_ACCESS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest

  frontend:
    name: Frontend Test Lint And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config

      - name: Build backend image
        run: docker build -t cloudsim-backend:ci ./backend

      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=http://localhost:8000 -t cloudsim-frontend:ci ./frontend
